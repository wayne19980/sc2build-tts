name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vue-app/src-tauri -> target

      - name: Install Python dependencies
        run: python -m pip install -r services/analyzer/requirements.txt

      - name: Build Python sidecar
        run: python scripts/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: vue-app
        run: pnpm install --frozen-lockfile

      - name: Validate updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
          if ($key -match '^(?:[A-Za-z]:\\|/)') {
            Write-Output "::error::TAURI_SIGNING_PRIVATE_KEY looks like a file path. Paste the full key file contents, not its path."
            exit 1
          }
          if ($key -match 'untrusted comment') {
            $decoded = $key
          } else {
            try {
              $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
            } catch {
              Write-Output "::error::TAURI_SIGNING_PRIVATE_KEY is not valid base64. Paste the full contents of sc2build-tts.key."
              exit 1
            }
          }
          if ($decoded -notmatch 'rsign encrypted secret key') {
            Write-Output "::error::TAURI_SIGNING_PRIVATE_KEY is not a Tauri private key. Make sure you pasted sc2build-tts.key, not the public key."
            exit 1
          }
          Write-Output "Updater signing key looks valid."

      - name: Build Tauri app
        working-directory: vue-app
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Output "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts"
            pnpm tauri:build
          } else {
            $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY.Trim()
            $updaterConfig = (Resolve-Path "src-tauri/tauri.updater.conf.toml").Path
            pnpm tauri:build -- --config "$updaterConfig"
          }

      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: >
          python scripts/generate_latest_json.py
          --tag "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --base-url "https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sc2build-tts-windows
          path: |
            vue-app/src-tauri/target/release/bundle/msi/*.msi
            vue-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload updater artifact
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: sc2build-tts-updater
          path: latest.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vue-app/src-tauri/target/release/bundle/msi/*.msi
            vue-app/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater manifest
        if: startsWith(github.ref, 'refs/tags/') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
